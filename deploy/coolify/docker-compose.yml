services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    environment:
      LAB_HOST: 0.0.0.0
      LAB_PORT: 8000
      STATUS_FILE: /data/status.json
      INGESTOR_INTERNAL_URL: http://ingestor:3001
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PROPAI_INTERNAL_TOKEN: ${PROPAI_INTERNAL_TOKEN:-}
      PROPAI_EMAIL_INGEST_TOKEN: ${PROPAI_EMAIL_INGEST_TOKEN:-}
      PROPAI_EMAIL_INGEST_TENANT_ID: ${PROPAI_EMAIL_INGEST_TENANT_ID:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PROPAI_TOKEN_ENCRYPTION_KEY: ${PROPAI_TOKEN_ENCRYPTION_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_KEY_2: ${NVIDIA_API_KEY_2:-}
      NVIDIA_API_KEY_3: ${NVIDIA_API_KEY_3:-}
      NVIDIA_API_KEY_4: ${NVIDIA_API_KEY_4:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      GROQ_API_KEY_4: ${GROQ_API_KEY_4:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      DOUBLEWORD_API_URL: ${DOUBLEWORD_API_URL:-https://api.doubleword.ai/v1}
      DOUBLEWORD_API_KEY: ${DOUBLEWORD_API_KEY:-}
      DOUBLEWORD_MODEL: ${DOUBLEWORD_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyageai/voyage-4-lite}
      EMBEDDING_DIMENSIONS: "1024"
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      FRONTEND_URL: https://app.propai.live
      COMPANION_WEBHOOK_SECRET: ${COMPANION_WEBHOOK_SECRET:-}
      AGENT_BROWSER_ARGS: "--no-sandbox,--disable-dev-shm-usage"
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_AGENT_MODEL: ${HERMES_AGENT_MODEL:-hermes-admin}
      SOCIAL_FLOW_AGENT_ENABLED: ${SOCIAL_FLOW_AGENT_ENABLED:-false}
      SOCIAL_FLOW_SDK_URL: ${SOCIAL_FLOW_SDK_URL:-}
      SOCIAL_FLOW_SDK_API_KEY: ${SOCIAL_FLOW_SDK_API_KEY:-}
      META_ADS_MCP_ENABLED: ${META_ADS_MCP_ENABLED:-false}
      META_ADS_MCP_URL: ${META_ADS_MCP_URL:-https://mcp.facebook.com/ads}
      META_ADS_MCP_PROTOCOL_VERSION: ${META_ADS_MCP_PROTOCOL_VERSION:-2025-06-18}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-https://app.propai.live/api/social-flow/meta/callback}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
      META_ADS_SCOPES: ${META_ADS_SCOPES:-ads_read,ads_management,business_management,pages_show_list,pages_read_engagement}
    volumes:
      - propai-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        LAB_API_BASE_URL: http://api:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
        DOUBLEWORD_API_URL: ${DOUBLEWORD_API_URL}
        DOUBLEWORD_API_KEY: ${DOUBLEWORD_API_KEY}
        DOUBLEWORD_MODEL: ${DOUBLEWORD_MODEL}
        # Set to /broker when the dashboard is served under ae.propai.live/broker.
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    environment:
      LAB_API_BASE_URL: http://api:8000
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      DOUBLEWORD_API_URL: ${DOUBLEWORD_API_URL}
      DOUBLEWORD_API_KEY: ${DOUBLEWORD_API_KEY}
      DOUBLEWORD_MODEL: ${DOUBLEWORD_MODEL}
    depends_on:
      - api
    expose:
      - "3000"
    restart: unless-stopped

  ingestor:
    build:
      context: ../..
      dockerfile: services/whatsmeow-ingestor/Dockerfile
    environment:
      PROPAI_WEBHOOK_URL: http://api:8000/webhook
      PROPAI_API_URL: http://api:8000
      PROPAI_INSTANCE_NAME: propai-whatsmeow
      PROPAI_DISABLE_HISTORY_SYNC: ${PROPAI_DISABLE_HISTORY_SYNC:-true}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PROPAI_INTERNAL_TOKEN: ${PROPAI_INTERNAL_TOKEN:-}
      STATUS_FILE: /data/status_default.json
      DATABASE_URL: postgres://postgres:${SUPABASE_DB_PASSWORD}@db.${SUPABASE_REF}.supabase.co:5432/postgres?sslmode=require
    volumes:
      - propai-data:/data
    depends_on:
      - api
    expose:
      - "3001"
    restart: unless-stopped

  extraction-worker:
    build:
      context: ../..
      # Use the worker-specific image so Coolify/buildpack deployments do not
      # need to honor a service-level command override to start extraction.
      dockerfile: Dockerfile.worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_KEY_2: ${NVIDIA_API_KEY_2:-}
      NVIDIA_API_KEY_3: ${NVIDIA_API_KEY_3:-}
      NVIDIA_API_KEY_4: ${NVIDIA_API_KEY_4:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      GROQ_API_KEY_4: ${GROQ_API_KEY_4:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      EXTRACTION_DOUBLEWORD_API_KEY: ${EXTRACTION_DOUBLEWORD_API_KEY:-}
      EXTRACTION_DOUBLEWORD_MODEL: ${EXTRACTION_DOUBLEWORD_MODEL:-}
      EXTRACTION_DOUBLEWORD_BASE_URL: ${EXTRACTION_DOUBLEWORD_BASE_URL:-https://api.doubleword.ai/v1}
      EXTRACTION_PROVIDER_TIMEOUT_SECONDS: ${EXTRACTION_PROVIDER_TIMEOUT_SECONDS:-180}
      FRONTEND_URL: https://app.propai.live
      EXTRACTION_WORKER_BATCH_SIZE: ${EXTRACTION_WORKER_BATCH_SIZE:-50}
      EXTRACTION_WORKER_POLL_SECONDS: 5
      EXTRACTION_WORKER_CONCURRENCY: ${EXTRACTION_WORKER_CONCURRENCY:-24}
      # Drain historical rows continuously while reserving equal capacity for
      # fresh WhatsApp traffic. Both lanes use atomic claims, so a second
      # worker replica can be added later without duplicate extraction.
      EXTRACTION_WORKER_LIVE_ONLY: ${EXTRACTION_WORKER_LIVE_ONLY:-false}
      EXTRACTION_WORKER_FAST_LANE_SLOTS: ${EXTRACTION_WORKER_FAST_LANE_SLOTS:-8}
      EXTRACTION_WORKER_BACKLOG_LANE_SLOTS: ${EXTRACTION_WORKER_BACKLOG_LANE_SLOTS:-16}
      EXTRACTION_WORKER_SERIALIZE_GROUPS: ${EXTRACTION_WORKER_SERIALIZE_GROUPS:-false}
      EXTRACTION_WORKER_LIVE_CUTOFF_AT: ${EXTRACTION_WORKER_LIVE_CUTOFF_AT:-}
    depends_on:
      - api
    restart: unless-stopped

  extraction-repair-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.repair-worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      EXTRACTION_REPAIR_WORKER_BATCH_SIZE: ${EXTRACTION_REPAIR_WORKER_BATCH_SIZE:-2}
      EXTRACTION_REPAIR_WORKER_POLL_SECONDS: ${EXTRACTION_REPAIR_WORKER_POLL_SECONDS:-5}
    depends_on:
      - api
    restart: unless-stopped

  enrichment-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    command: ["python", "worker.py"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_KEY_2: ${NVIDIA_API_KEY_2:-}
      NVIDIA_API_KEY_3: ${NVIDIA_API_KEY_3:-}
      NVIDIA_API_KEY_4: ${NVIDIA_API_KEY_4:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      GROQ_API_KEY_4: ${GROQ_API_KEY_4:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

  building-enrichment-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.api
      args:
        INSTALL_BUILDING_DISCOVERY: "true"
    command: ["python", "building_enrichment_worker.py"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_API_KEY_2: ${NVIDIA_API_KEY_2:-}
      NVIDIA_API_KEY_3: ${NVIDIA_API_KEY_3:-}
      NVIDIA_API_KEY_4: ${NVIDIA_API_KEY_4:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
      GROQ_API_KEY_4: ${GROQ_API_KEY_4:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      BUILDING_ENRICHMENT_WORKER_BATCH_SIZE: ${BUILDING_ENRICHMENT_WORKER_BATCH_SIZE:-100}
      BUILDING_ENRICHMENT_WORKER_CONCURRENCY: ${BUILDING_ENRICHMENT_WORKER_CONCURRENCY:-10}
      BUILDING_ENRICHMENT_WORKER_POLL_SECONDS: ${BUILDING_ENRICHMENT_WORKER_POLL_SECONDS:-5}
      BUILDING_ENRICHMENT_CONFIDENCE_THRESHOLD: 0.7
      BUILDING_ENRICHMENT_MAX_RETRIES: ${BUILDING_ENRICHMENT_MAX_RETRIES:-2}
      BUILDING_ENRICHMENT_WEB_SEARCH_ENABLED: ${BUILDING_ENRICHMENT_WEB_SEARCH_ENABLED:-true}
      BUILDING_ENRICHMENT_WEB_SEARCH_MAX_PER_DAY: ${BUILDING_ENRICHMENT_WEB_SEARCH_MAX_PER_DAY:-50}
    depends_on:
      - api
    restart: unless-stopped

  semantic-embedding-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    command: ["python", "semantic_embedding_worker.py"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyageai/voyage-4-lite}
      EMBEDDING_DIMENSIONS: "1024"
      SEMANTIC_WORKER_BATCH_SIZE: ${SEMANTIC_WORKER_BATCH_SIZE:-16}
      SEMANTIC_WORKER_POLL_SECONDS: ${SEMANTIC_WORKER_POLL_SECONDS:-5}
      SEMANTIC_WORKER_MAX_ATTEMPTS: ${SEMANTIC_WORKER_MAX_ATTEMPTS:-5}
      SEMANTIC_WORKER_ENABLED: ${SEMANTIC_WORKER_ENABLED:-false}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  propai-data:
